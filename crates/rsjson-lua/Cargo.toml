[package]
name = "rsjson-lua"
version = "0.7.1"
edition = "2024"
description = "a json lua module using the serde-json rust crate"
repository = "https://github.com/benniekiss/rs-mod-lua"
license = "MIT"
keywords = ["json", "lua", "mlua", "module", "serde-json"]
categories = ["encoding"]

[lib]
crate-type = ["cdylib", "rlib"]
name = "rsjson_lua"

[dependencies]
mlua = { workspace = true, features = ["macros", "serde"] }
rs-mod-lua-core = { workspace = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = {
  version = "1.0.151",
  features = [
    "float_roundtrip",
    "preserve_order",
  ]
}

[features]
default = ["lua54", "vendored"]
arbitrary_precision = ["serde_json/arbitrary_precision"]
lua51 = ["mlua/lua51"]
lua52 = ["mlua/lua52"]
lua53 = ["mlua/lua53"]
lua54 = ["mlua/lua54"]
lua55 = ["mlua/lua55"]
luajit = ["mlua/luajit"]
luajit52 = ["mlua/luajit52"]
module = ["mlua/module"]
vendored = ["mlua/vendored"]
