[package]
name = "rs-mod-lua-core"
version = "0.1.1"
edition.workspace = true
description = "core crate for rs-mod-lua modules"
repository.workspace = true
license.workspace = true
keywords = ["lua", "mlua", "module"]

[lib]
crate-type = ["lib"]
name = "rs_mod_lua_core"

[dependencies]
mlua = { workspace = true, features = ["macros"] }
serde = { version = "1.0.229", optional = true }

[features]
default = ["lua54", "serde", "vendored"]
lua51 = ["mlua/lua51"]
lua52 = ["mlua/lua52"]
lua53 = ["mlua/lua53"]
lua54 = ["mlua/lua54"]
lua55 = ["mlua/lua55"]
luajit = ["mlua/luajit"]
luajit52 = ["mlua/luajit52"]
module = ["mlua/module"]
serde = ["dep:serde", "mlua/serde"]
vendored = ["mlua/vendored"]
