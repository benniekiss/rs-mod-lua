package = "rsre-lua"
version = "0.4.1"
lua = ">=5.1"

[project]
root_dir = "../.."

[description]
summary = "a regex lua module using the fancy-regex rust crate"
maintainer = "benniekiss"
homepage = "https://github.com/benniekiss/rs-mod-lua"
issues_url = "https://github.com/benniekiss/rs-mod-lua/issues"
labels = ["regex"]
license = "MIT"

[source]
url = "https://github.com/benniekiss/rs-mod-lua/archive/refs/tags/$(PACKAGE)-v$(VERSION).zip"
dev = "git+https://github.com/benniekiss/rs-mod-lua"

[build]
type = "rust-mlua"
cargo_extra_args = ["--package", "rsre-lua", "--locked"]
default_features = false
features = ["module"]

[build.modules]
"rsre" = "rsre_lua"

[build.include]
"crates/rsre-lua/library/rsre.d.lua" = "rsre.d.lua"

[test]
type = "busted"
flags = ["-C", "crates/rsre-lua"]
