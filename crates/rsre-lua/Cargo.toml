cargo-features = ["panic-immediate-abort", "profile-rustflags"]

[package]
name = "rsre-lua"
version = "0.3.6"
edition = "2024"
description = "a regex lua module using the fancy-regex rust crate"
repository = "https://github.com/benniekiss/rs-mod-lua"
license = "MIT"
keywords = ["fancy-regex", "lua", "mlua", "module", "regex"]
categories = ["text-processing"]

[lib]
crate-type = ["cdylib", "rlib"]
name = "rsre_lua"

[dependencies]
fancy-regex = "0.19.0"
mlua = { workspace = true, features = ["macros"] }

[features]
default = ["lua54", "vendored"]
lua51 = ["mlua/lua51"]
lua52 = ["mlua/lua52"]
lua53 = ["mlua/lua53"]
lua54 = ["mlua/lua54"]
lua55 = ["mlua/lua55"]
luajit = ["mlua/luajit"]
luajit52 = ["mlua/luajit52"]
module = ["mlua/module"]
vendored = ["mlua/vendored"]
