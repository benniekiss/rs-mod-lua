[package]
name = "rsreq-lua"
version = "0.1.0"
edition.workspace = true
description = "an http client lua module using the reqwest rust crate"
repository.workspace = true
license.workspace = true
keywords = ["client", "http", "lua", "mlua", "module"]
categories = ["text-processing"]

[features]
default = ["async", "lua54", "vendored"]
async = ["mlua/async"]
lua51 = ["mlua/lua51"]
lua52 = ["mlua/lua52"]
lua53 = ["mlua/lua53"]
lua54 = ["mlua/lua54"]
lua55 = ["mlua/lua55"]
luajit = ["mlua/luajit"]
luajit52 = ["mlua/luajit52"]
module = ["mlua/module"]
vendored = ["mlua/vendored"]

[lib]
crate-type = ["cdylib", "rlib"]
name = "rsreq_lua"

[dependencies]
mlua = { workspace = true, features = ["macros", "serde"] }
reqwest = { version = "0.13.5", features = ["form", "json", "multipart", "query", "stream"] }

serde = { version = "1.0.229", features = ["derive"] }
