package = "rsreq-lua"
version = "0.1.0"
lua = ">=5.1"

[project]
root_dir = "../.."

[description]
summary = "an http client lua module using the reqwest rust crate"
maintainer = "benniekiss"
homepage = "https://github.com/benniekiss/rs-mod-lua"
issues_url = "https://github.com/benniekiss/rs-mod-lua/issues"
labels = ["http"]
license = "MIT"

[source]
url = "https://github.com/benniekiss/rs-mod-lua/archive/refs/tags/$(PACKAGE)-v$(VERSION).zip"
dev = "git+https://github.com/benniekiss/rs-mod-lua"
dir = "rs-mod-lua-$(PACKAGE)-v$(VERSION)"

[build]
type = "rust-mlua"
cargo_extra_args = ["--package", "rsreq-lua", "--locked"]
default_features = false
features = ["module"]

[build.modules]
"rsreq" = "rsreq_lua"

[build.include]
"crates/rsreq-lua/library/rsreq.d.lua" = "rsreq.d.lua"

[test]
type = "busted"
flags = ["-C", "crates/rsreq-lua"]
