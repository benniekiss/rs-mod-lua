name: Renovate

on:
  workflow_dispatch:
    inputs:
      logLevel:
        description: "Log Level"
        required: true
        default: "info"
        type: choice
        options:
          - info
          - debug
          - warning
  schedule:
    - cron: "0 8 */3 * *"

env:
  # renovate: datasource=docker depName=ghcr.io/renovatebot/renovate
  RENOVATE_VERSION: 44.198.3

jobs:
  renovate:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Generate GitHub token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        id: generate-token
        with:
          client-id: ${{ secrets.RENOVATE_APP_ID }}
          private-key: ${{ secrets.RENOVATE_PRIVATE_KEY }}

      - name: Run renovate
        uses: renovatebot/github-action@2804199d260ad00c1fae0e9e842888369391c776 # v46.3.10
        env:
          LOG_LEVEL: ${{ inputs.logLevel }}
          RENOVATE_REPOSITORIES: ${{ github.repository }}
        with:
          renovate-version: ${{ env.RENOVATE_VERSION }}
          token: ${{ steps.generate-token.outputs.token }}
