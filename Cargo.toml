cargo-features = ["panic-immediate-abort", "profile-rustflags"]

[workspace]
resolver = "3"
members = [
  "crates/jsonschema-lua",
  "crates/minijinja-lua",
  "crates/rs-mod-lua-core",
  "crates/rsast-lua",
  "crates/rsjson-lua",
  "crates/rsre-lua",
]

[workspace.dependencies]
mlua = { version = "0.12.1" }
rs-mod-lua-core = { path = "crates/rs-mod-lua-core" }

[profile.release]
opt-level = "z"
strip = true
lto = true
panic = "unwind"
codegen-units = 1
rustflags = [
  "-Dwarnings",
  "-Zlocation-detail=none",
  "-Zfmt-debug=none",
]

[profile.release.package.jsonschema-lua]
opt-level = 3

[profile.release.package.rsjson-lua]
opt-level = 3

[profile.release.package.rsre-lua]
opt-level = 3
